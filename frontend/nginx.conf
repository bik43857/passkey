# NOTE: this file is processed as an nginx templating file (copied to
# /etc/nginx/templates/default.conf.template in the Dockerfile) — the
# official nginx image's entrypoint runs `envsubst` on it at container
# startup, substituting ${DOMAIN_NAME} from the container's environment
# (set via docker-compose.prod.yml / your .env). Don't rename this file
# without updating the Dockerfile's COPY destination to match.
#
# Serves the compiled React app and reverse-proxies /api to the Spring Boot
# backend, so the browser sees ONE origin for everything — matching the
# Section 18 diagram: Browser → HTTPS → Nginx → React → /api → Spring Boot.
# Same-origin means the session cookie's SameSite attribute works exactly
# as intended with no cross-origin CORS complexity at all in production
# (CORS in SecurityConfig is still there for local dev, where the Vite dev
# server and Spring Boot run on different ports).
#
# WebAuthn REQUIRES a secure context in production — there is no "localhost
# exception" once you're on a real domain, so TLS termination here isn't
# optional polish, it's a hard functional requirement (see Phase 1's
# architecture notes and Section 16).

# Plain HTTP: only serves ACME (Let's Encrypt) domain-validation challenges
# and redirects everything else to HTTPS. Certbot's webroot plugin writes
# into /var/www/certbot during renewal — see PHASE9_README.md for the
# one-time setup and the renewal cron entry.
server {
    listen 80;
    server_name ${DOMAIN_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    # Populated by certbot (or your CA of choice) into this mounted path —
    # see the volumes section of docker-compose.prod.yml.
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file goes to
    # index.html so React Router (BrowserRouter) can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite's build, so they're safe to
    # cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Forwarded so the backend's ServerProperty (WebAuthn RP ID/origin
        # checks) and AuditService's IP logging see the REAL client, not
        # this proxy hop.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies (session + CSRF) must pass through untouched.
        proxy_pass_header Set-Cookie;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # Baseline security headers at the edge; SecurityConfig also sets CSP
    # and Referrer-Policy on API responses specifically. Belt and suspenders.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
