# Production stack: Browser → HTTPS → Nginx (frontend + reverse proxy) →
# Spring Boot backend → PostgreSQL — exactly the Section 18 diagram.
# The local-dev docker-compose.yml (repo root) only runs Postgres; this file
# is the full stack for an actual deployment. See PHASE9_README.md for the
# one-time TLS setup and how to bring this up.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-authdb}
      POSTGRES_USER: ${DATABASE_USERNAME:-authuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-authuser} -d ${DATABASE_NAME:-authdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-authdb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-authuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      WEBAUTHN_RP_ID: ${DOMAIN_NAME:?set DOMAIN_NAME in .env}
      WEBAUTHN_RP_NAME: ${APP_NAME:-Passkey Auth}
      # Must be the exact HTTPS origin users will actually visit — see the
      # WebAuthnProperties Javadoc / Phase 3 README on why this has to match
      # byte-for-byte with what the browser sends as the ceremony origin.
      WEBAUTHN_ORIGIN: https://${DOMAIN_NAME:?set DOMAIN_NAME in .env}
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env — generate with: openssl rand -base64 48}"
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${DOMAIN_NAME:?set DOMAIN_NAME in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]
    # No "ports:" — the backend is reached ONLY through the frontend/Nginx
    # container on the internal network, never exposed to the host directly.

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?set DOMAIN_NAME in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  # Renews the TLS certificate every 12 hours (a no-op unless within 30 days
  # of expiry — certbot's own logic). The FIRST certificate has to be issued
  # manually once, before this loop has anything to renew — see
  # PHASE9_README.md for that one-time command.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

networks:
  internal:

volumes:
  auth_pg_data:
  certbot_certs:
  certbot_webroot:
