spring:
  application:
    name: auth-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DATABASE_USERNAME:authuser}
    password: ${DATABASE_PASSWORD:authpass}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  # Behind Nginx in production; needed so cookie "Secure" logic and client-IP
  # logging in AuditLog use the real scheme/IP rather than the proxy's.
  forward-headers-strategy: framework

webauthn:
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  rp-name: ${WEBAUTHN_RP_NAME:My Passkey App}
  origin: ${WEBAUTHN_ORIGIN:http://localhost:5173}
  challenge-ttl-seconds: ${WEBAUTHN_CHALLENGE_TTL:120}

app:
  session:
    cookie-name: SESSION
    ttl-hours: ${SESSION_TTL_HOURS:12}
    secret: ${SESSION_SECRET:dev-only-change-me}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}   # true in production (HTTPS required)
    cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    login-attempts-per-minute: 5
    register-attempts-per-minute: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # "always" would leak DB/disk details to an unauthenticated caller;
      # the summary UP/DOWN status is all the Docker healthcheck needs.
      show-details: never

logging:
  level:
    root: INFO
    com.example.auth: INFO
    # Never set WebAuthn/security packages to DEBUG in production — verbose
    # logs can leak challenge values or client data JSON into log aggregators.

---
spring:
  config:
    activate:
      on-profile: prod
app:
  session:
    cookie-secure: true
    cookie-same-site: Strict

---
# UAT: mirrors prod's session/cookie security posture (real HTTPS domain, so
# cookie-secure must stay true — WebAuthn itself also requires a secure
# context on any non-localhost origin, so UAT cannot run over plain HTTP
# regardless of this setting) but relaxes a few things purely for testability:
#   - same-site Lax instead of Strict: prod uses Strict; Lax is kept here in
#     case QA tooling/links land testers on the app via a cross-site redirect.
#     Tighten to Strict if that's not a concern for your testers.
#   - higher rate limits: prod's 5/3 per minute is realistic for real users,
#     but easy for a tester running through the same flow repeatedly to trip.
#   - DEBUG app logging: fine for a non-production environment with test
#     data; still deliberately NOT applied to WebAuthn/security packages,
#     for the same reason noted above (challenge/clientData leakage).
#   - actuator "info" exposed alongside "health", so QA/monitoring can see
#     build/version metadata without another deploy just to check what's live.
spring:
  config:
    activate:
      on-profile: uat
app:
  session:
    cookie-secure: true
    cookie-same-site: Lax
  rate-limit:
    login-attempts-per-minute: 20
    register-attempts-per-minute: 20
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.example.auth: DEBUG
